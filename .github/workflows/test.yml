# GitHub Actions workflow for Odin for Azure Local
# Runs full validation on pushes and pull requests, plus a daily dependency audit

name: Test & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, Release]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

# Opt into Node.js 24 for GitHub Actions runners (Node.js 20 deprecated June 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Permissions required for dorny/test-reporter to create check runs
permissions:
  contents: read
  actions: read
  checks: write

jobs:
  lint:
    name: ESLint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install ESLint
        run: |
          for i in 1 2 3 4 5; do
            npm install eslint@8 && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
      
      - name: Run ESLint on JS modules
        run: npx eslint "js/*.js" "arm/*.js" "report/*.js" "sizer/*.js" "switch-config/**/*.js" "docs/outbound-connectivity/*.js" --format stylish

  test:
    name: ODIN Unit Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            npm install && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
      
      - name: Run Unit Tests
        run: node scripts/run-tests.js

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Publish JUnit Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: ODIN Unit Tests
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: true

  html-validate:
    name: HTML Validation
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            npm ci && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
      
      - name: Validate HTML files
        run: npx html-validate index.html arm/arm.html report/report.html sizer/index.html switch-config/index.html docs/outbound-connectivity/index.html docs/reference-architectures/index.html --formatter stylish

  stylelint:
    name: CSS Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run stylelint on CSS files
        run: npm run lint:css

  pptx-smoke:
    name: PPTX Export Smoke Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            npm install && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Run PPTX smoke test
        run: node scripts/smoke-test-pptx.js

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            npm install && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Run npm audit (high severity blocks build)
        run: node scripts/check-npm-audit.js
